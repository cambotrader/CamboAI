services:
  - type: web
    name: camboai-backend
    env: python
    plan: free
    region: oregon
    buildCommand: cd backend && pip install --no-cache-dir -r requirements.simple.txt
    startCommand: cd backend && uvicorn simple_server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

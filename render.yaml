services:
  - type: web
    name: camboai-backend
    env: python
    plan: free
    region: oregon
    repo: https://github.com/cambotrader/CamboAI
    branch: main
    services:
  - type: web
    name: camboai-traderstation
    env: python
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[program:uvicorn]
command=python -m uvicorn simple_server:app --host 0.0.0.0 --port 8000
directory=/app/backend
stdout_logfile=/var/log/uvicorn/stdout.log
stderr_logfile=/var/log/uvicorn/stderr.log
autostart=true
autorestart=true
startretries=3

[program:nginx]
command=/bin/sh -c "envsubst < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log
autostart=true
autorestart=true
startretries=3

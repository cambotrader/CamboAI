# Minimal mypy config for better editor support without blocking CI
[mypy]
python_version = 3.9
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
show_error_codes = True
pretty = True
strict_optional = True
ignore_missing_imports = True

[mypy-backend.*]
# Be a bit stricter in backend while allowing third-party stubs to be missing
ignore_missing_imports = True
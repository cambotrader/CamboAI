# Redis Configuration for Cambo AI Trader Station
# Production-ready Redis configuration

# Network
bind 127.0.0.1
port 6379
protected-mode yes

# Security
requirepass your_redis_password_change_this
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_9a8b7c6d5e4f"

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename cambo-ai-trader.rdb
dir /var/lib/redis

# Append Only File
appendonly yes
appendfilename "cambo-ai-trader.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client Configuration
timeout 300
tcp-keepalive 300
tcp-backlog 511

# Memory Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Threaded I/O
io-threads 4
io-threads-do-reads yes

# Rate Limiting Keys TTL
# Keys used for rate limiting will expire automatically
# Format: rate_limit:identifier:window:timestamp

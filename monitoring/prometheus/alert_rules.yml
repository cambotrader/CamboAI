groups:
- name: api-v2-alerts
  interval: 30s
  rules:
  - alert: HighErrorRate
    expr: sum(rate(http_request_total{status=~"5.."}[5m])) / sum(rate(http_request_total[5m])) > 0.01
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High HTTP 5xx error rate"
      description: "Error rate >1% for 10m"

  - alert: HighLatencyP95
    expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[10m])) by (le)) > 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High p95 latency"
      description: "HTTP p95 latency > 800ms for 10m"

  - alert: LowCacheHitRatio
    expr: (sum(rate(cache_hits_total[30m])) / (sum(rate(cache_hits_total[30m])) + sum(rate(cache_misses_total[30m])))) < 0.5
    for: 30m
    labels:
      severity: info
    annotations:
      summary: "Low cache hit ratio"
      description: "Cache hit ratio < 50% for 30m"